name: Build and Push Custom Image

on:
  schedule:
    - cron: "17 20 * * *" # 每天定时触发
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: edwardwoodhub/my-bluefin-vm

jobs:
  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # 1. 释放磁盘空间（构建完整的 OS 基础镜像需要充足的空间）
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      # 2. 检出代码
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 3. 设置 Docker Buildx（多标签与多 Registry 支持）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 登录阿里云 ACR（仅在 PR 之外执行，防止 Secret 泄露）
      - name: Log in to Aliyun ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # 6. 本地构建并直接推送到两个 Registry
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          # 仅在非 PR 阶段才真正执行 push
          push: ${{ github.event_name != 'pull_request' }}
          # 同时打上 GHCR 和 ACR 的目标 tag，Docker 会在本地构建一次后分别推送到两个仓库
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ==========================================
  # Job 2：将构建好的镜像转换为 qcow2 镜像并作为 Artifacts 供下载
  # ==========================================
  build-disk:
    name: Build QCOW2 Disk Image
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Custom Image to Local
        run: |
          sudo podman pull ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Build QCOW2
        run: |
          mkdir -p ./output
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Upload QCOW2 as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-bluefin-qcow2
          path: ./output/qcow2/disk.qcow2
          if-no-files-found: error
