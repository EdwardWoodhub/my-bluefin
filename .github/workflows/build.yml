name: bluebuild
on:
  schedule:
    - cron:
        "38 20 * * *" # build at 04:38 CST every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.10
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }} # 这里的钥匙现在你有啦！
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

# ==========================================
  # Job 2：【新增】将上面构建好的容器镜像转换为 qcow2 镜像并作为 Artifacts 供下载
  # ==========================================
  build-disk:
    name: Build QCOW2 Disk Image
    runs-on: ubuntu-latest
    needs: bluebuild # 必须要等 Job 1（容器构建）成功后才会执行此步骤
    # 仅在 main 默认分支上推送或手动触发时才生成磁盘镜像，避免 PR 时浪费 Actions 额度
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      # 1. 释放 GitHub Runner 的磁盘空间，防止编译虚拟机镜像时爆磁盘
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      # 2. 检出代码以读取必要信息
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 3. 使用 bootc-image-builder 将刚才打包好的 GHCR 镜像转换为 qcow2 格式
      - name: Build QCOW2
        # 我们使用红帽官方推荐的 bootc 镜像构建工具（容器版运行）
        run: |
          mkdir -p ./output
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            ghcr.io/edwardwoodhub/my-bluefin-vm:latest
          # 💡 注意：请将上面最后一行的 "your-image-name" 替换为你在 recipe.yml 或 GitHub 中实际生成的容器镜像名称。

      # 4. 将生成的 qcow2 文件上传到 GitHub 运行结果的 Artifacts 中
      - name: Upload QCOW2 as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-bluefin-qcow2
          path: ./output/qcow2/disk.qcow2
          if-no-files-found: error
