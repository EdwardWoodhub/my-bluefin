name: Build and Push Custom Image

on:
  schedule:
    - cron: "17 20 * * *" # 每天定时触发
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: edwardwoodhub/my-bluefin-vm

jobs:
  # ========================================================
  # Job 1：在宿主机使用原生 Podman 构建镜像，并串行推送到两个 Registry
  # ========================================================
  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. 释放虚拟机磁盘空间，防止打包 OS 镜像爆盘
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      # 2. 登录 GHCR 和 阿里云 ACR（统一以 root 权限登录，保证后续 sudo podman 正常读取凭证）
      - name: Log in to Registries (GHCR & Aliyun ACR)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Logging in to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "Logging in to Aliyun ACR..."
          echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | sudo podman login ${{ secrets.ALIYUN_ACR_REGISTRY }} -u ${{ secrets.ALIYUN_ACR_USERNAME }} --password-stdin

      # 3. 宿主机原生构建系统镜像（放开特权，确保 rpm-ostree 操作顺畅）
      - name: Build System Image
        run: |
          echo "Starting native Podman build..."
          sudo podman build \
            --cap-add=all \
            --security-opt seccomp=unconfined \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
            -t ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -f Containerfile .

      # 4. 依次推送镜像至两个 Registry
      - name: Push Images
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Pushing to GHCR via Podman..."
          sudo podman push ghcr.io/${{ env.IMAGE_NAME }}:latest

      # 推送到 GHCR 之后，直接从本地 Podman 缓存推向 Aliyun ACR
      - name: Sync Image to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Pushing directly from local Podman storage to Aliyun ACR..."
          sudo skopeo copy \
            --insecure-policy \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            --retry-times 5 \
            containers-storage:ghcr.io/${{ env.IMAGE_NAME }}:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
          
         
      

  # ========================================================
  # Job 2：将构建好的镜像转换为 qcow2 镜像并作为 Artifacts 供下载
  # ========================================================
  build-disk:
    name: Build QCOW2 Disk Image
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      # 1. 释放虚拟机磁盘空间
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      # 2. 检出代码
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 3. 登录 GHCR 以获得拉取镜像权限
      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 拉取刚刚构建好的最新系统镜像到本地
      - name: Pull Custom Image to Local
        run: |
          sudo podman pull ghcr.io/${{ env.IMAGE_NAME }}:latest

      # 5. 使用 bootc-image-builder 将镜像转换为 qcow2 格式
      - name: Build QCOW2
        run: |
          mkdir -p ./output
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      # 6. 上传生成的 qcow2 文件至 Artifacts
      - name: Upload QCOW2 as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-bluefin-qcow2
          path: ./output/qcow2/disk.qcow2
          if-no-files-found: error
