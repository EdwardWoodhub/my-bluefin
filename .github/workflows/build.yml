name: Build GNOME OS Based On Fedora Silverblue 44 Bootc Image 

on:
  schedule:
    - cron: "17 20 * * *" # 每天定时触发
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: edwardwoodhub/my-bluefin-vm

jobs:
  # ========================================================
  # 单 Job 串行执行：构建 -> 发布 LiveISO -> 制作并上传 QCOW2 -> 推送镜像到 Registry
  # ========================================================
  build-and-deliver:
    name: Build, Deliver ISO & QCOW2, and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. 释放虚拟机磁盘空间
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      # 2. 登录 GHCR 和 阿里云 ACR（提前以 root 权限登录，后续 podman / skopeo 均可使用）
      - name: Log in to Registries (GHCR & Aliyun ACR)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Logging in to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "Logging in to Aliyun ACR..."
          echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | sudo podman login ${{ secrets.ALIYUN_ACR_REGISTRY }} -u ${{ secrets.ALIYUN_ACR_USERNAME }} --password-stdin

      # 3. 本地原生构建系统镜像（直接保存在宿主机 Podman 本地存储）
      - name: Build System Image
        run: |
          echo "Starting native Podman build..."
          sudo podman build \
            --cap-add=all \
            --security-opt seccomp=unconfined \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
            -t ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -f Containerfile .

      # ========================================================
      # 阶段 1：使用 bootc-image-builder 构建 LiveISO 并发布到 GitHub Releases
      # ========================================================
      - name: Build Live ISO
        run: |
          sudo rm -rf ./output
          mkdir -p ./output
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs ext4 \
            ghcr.io/${{ env.IMAGE_NAME }}:latest

          ISO_PATH=$(find ./output -type f -name "*.iso" | head -n 1)
          cp "$ISO_PATH" ./my-bluefin-live.iso

      - name: Split ISO
        run: |
          split -b 1500M my-bluefin-live.iso my-bluefin-live.iso.part-

      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          files: my-bluefin-live.iso.part-*
          tag_name: live-iso-${{ github.run_number }}
          name: "Live ISO Build ${{ github.run_number }}"
          generate_release_notes: true

      # 清理 ISO 中间产物，避免后续制作 QCOW2 时磁盘空间不足
      - name: Clean ISO Build Artifacts
        run: |
          sudo rm -rf ./output
          rm -f my-bluefin-live.iso*

      # ========================================================
      # 阶段 2：使用 bootc-image-builder 构建 QCOW2 并上传至 Artifacts
      # ========================================================
      - name: Build QCOW2
        run: |
          mkdir -p ./output
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Upload QCOW2 as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-bluefin-qcow2
          path: ./output/qcow2/disk.qcow2
          if-no-files-found: error

      # ========================================================
      # 阶段 3：最后将容器镜像推送到 GHCR 和 阿里云 ACR
      # ========================================================
      - name: Push Image to GHCR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Pushing to GHCR via Podman..."
          sudo podman push ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Sync Image to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Pushing directly from local Podman storage to Aliyun ACR..."
          sudo skopeo copy \
            --insecure-policy \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            --retry-times 5 \
            containers-storage:ghcr.io/${{ env.IMAGE_NAME }}:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
